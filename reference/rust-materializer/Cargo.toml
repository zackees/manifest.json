[package]
name = "manifest-materializer-reference"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
sha2 = "0.10"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
